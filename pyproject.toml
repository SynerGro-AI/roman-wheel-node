[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-wheel-node"
dynamic = ["version"]
description = "Exact-copy gate + learning, append-only Bayesian source weighting for filtering agent claims."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Wilson" }, { name = "SynerGro.AI" }]
keywords = ["agents", "verification", "bayesian", "source-reliability", "roman-wheel", "deterministic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
bench = ["matplotlib>=3.5"]
local-nli = ["onnxruntime>=1.16", "tokenizers>=0.15", "numpy"]
local-nli2 = ["torch", "transformers>=4.40", "sentencepiece", "protobuf"]

[project.scripts]
roman-wheel-node = "roman_wheel_node.__main__:main"

[project.urls]
Homepage = "https://github.com/SynerGro-AI/roman-wheel-node"
Source = "https://github.com/SynerGro-AI/roman-wheel-node"
Issues = "https://github.com/SynerGro-AI/roman-wheel-node/issues"
Changelog = "https://github.com/SynerGro-AI/roman-wheel-node/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "roman_wheel_node._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roman_wheel_node = ["py.typed", "policies/*.json"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
