[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-wheel-node"
version = "1.0.0"
description = "Exact-copy gate + learning, append-only Bayesian source weighting for filtering agent claims."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Wilson" }, { name = "SynerGro.AI" }]
keywords = ["agents", "verification", "bayesian", "source-reliability", "roman-wheel", "deterministic"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
bench = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/SynerGro-AI/roman-wheel-node"
Issues = "https://github.com/SynerGro-AI/roman-wheel-node/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roman_wheel_node = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
