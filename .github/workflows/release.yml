name: Release

# Publishes to PyPI only from a pushed v* tag, through PyPI trusted publishing (OIDC; no stored token).
# A manual run (workflow_dispatch) runs the build job only; the publish job is skipped unless the ref is a v* tag.
# Guards: a tag must point at a commit on main, and publish refuses to run unless the `pypi` environment requires a
# reviewer. Concurrency is per job: a newer run may cancel an older build, but never an upload in progress.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history and branches, for the tag-on-main check
      - name: Tag commit is on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "tag ${TAG} (${GITHUB_SHA}) is not an ancestor of origin/main: refusing to release"
            exit 1
          }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.2" "build==1.6.1" "twine==7.0.0"
          python -m pip install -e ".[test]"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import roman_wheel_node; print(roman_wheel_node.__version__)')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} does not match package version ${version}"; exit 1; }
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: SciFact test data (pinned by sha256)
        run: python scripts/fetch_test_data.py
      - name: Tests (warnings are errors; a skipped test fails the release)
        shell: bash # explicit bash runs with -eo pipefail, so a pytest failure still fails the step through tee
        run: |
          python -m pytest -q -rs -W error 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          if grep -q '^SKIPPED' "$RUNNER_TEMP/pytest.out"; then
            echo "skipped tests are not allowed in a release build"
            exit 1
          fi
      - name: Tests with locale-default text I/O as an error (EncodingWarning)
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q -W error -p no:cacheprovider
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check --strict dist/*
      - name: Fresh-venv wheel install, smoke import and CLI
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --upgrade pip
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python -c 'import roman_wheel_node as r; from roman_wheel_node.policy import load_policy; print(r.__version__, load_policy().version)'
          /tmp/wheelcheck/bin/roman-wheel-node --version
          /tmp/wheelcheck/bin/roman-wheel-node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false # never cancel an upload half-way
    environment:
      name: pypi
      url: https://pypi.org/project/roman-wheel-node/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
      actions: read # lets GITHUB_TOKEN read the pypi environment's protection rules for the guard below
    steps:
      - name: Require a reviewer on the pypi environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh api "repos/${GITHUB_REPOSITORY}/environments/pypi" \
            --jq '[.protection_rules[]? | select(.type=="required_reviewers")] | length')"
          if [ "${n:-0}" -lt 1 ]; then
            echo "the pypi environment has no required_reviewers protection rule: refusing to publish"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
