name: Release

# Publishes to PyPI only from a pushed v* tag, through PyPI trusted publishing (OIDC; no stored token).
# A manual run (workflow_dispatch) runs the build job only; the publish job is skipped unless the ref is a v* tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.2" "build==1.6.1" "twine==7.0.0"
          python -m pip install -e ".[test]"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import roman_wheel_node; print(roman_wheel_node.__version__)')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} does not match package version ${version}"; exit 1; }
      - name: Ruff
        run: ruff check .
      - name: Tests (warnings are errors; opt-in skips are reported)
        run: python -m pytest -q -rs -W error
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check --strict dist/*
      - name: Fresh-venv wheel install, smoke import and CLI
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --upgrade pip
          /tmp/wheelcheck/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python -c 'import roman_wheel_node as r; from roman_wheel_node.policy import load_policy; print(r.__version__, load_policy().version)'
          /tmp/wheelcheck/bin/roman-wheel-node --version
          /tmp/wheelcheck/bin/roman-wheel-node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/roman-wheel-node/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
