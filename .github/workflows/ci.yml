name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Runners are pinned (not *-latest) so an image roll-over cannot silently change the test environment.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows: the locale encoding is cp1252, which is what broke non-ASCII claims in 1.2.0 (B1).
          - os: windows-2025
            python-version: "3.13"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: SciFact test data (pinned by sha256; needed by tests/test_repo_data.py, which fails without it)
        run: python scripts/fetch_test_data.py
      - name: Unit tests (warnings are errors)
        run: python -m pytest -q -W error
      - name: Unit tests with locale-default text I/O as an error (EncodingWarning, Python >= 3.10)
        if: matrix.python-version != '3.9'
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q -W error
      - name: Benchmark CLI smoke (byte-identical check on a small config)
        run: |
          python -m roman_wheel_node.bench --seeds 2 --scenarios cold_start --ceiling-claims 500 --no-plots --out "$RUNNER_TEMP/b1" --jobs 1
          python -m roman_wheel_node.bench --seeds 2 --scenarios cold_start --ceiling-claims 500 --check "$RUNNER_TEMP/b1" --jobs 1
      - name: Original six reference calls
        run: python -m roman_wheel_node

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: ruff
        run: |
          python -m pip install "ruff==0.17.2"
          ruff check .
          ruff format --check .

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build sdist + wheel (not published) and check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          ls -la dist/
